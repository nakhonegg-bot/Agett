<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aget – Food Delivery</title>
<meta name="description" content="Order your favorite meals from Aget with fast, on-demand delivery.">
<meta name="theme-color" content="#328465">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍲%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="a.css">
</head>
<body>
<header id="site" class="site" hidden>
  <div class="site-in">
    <button class="brand" data-act="go" data-to="home" aria-label="Aget home"><span aria-hidden="true">🍲</span>Aget</button>
    <nav id="nav" class="mainnav" aria-label="Main navigation">
      <button data-act="go" data-to="home" data-nav="home"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>Home</button>
      <button data-act="go" data-to="menu" data-nav="menu"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>Menu</button>
      <button data-act="go" data-to="cart" data-nav="cart"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h3l2 11h10l2-8H7"/><circle cx="10" cy="20" r="1"/><circle cx="17" cy="20" r="1"/></svg>Cart<span id="badge" class="badge" hidden>0</span></button>
      <button data-act="go" data-to="profile" data-nav="profile"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>Profile</button>
    </nav>
    <button class="iconbtn" data-act="theme" aria-label="Toggle dark mode">◐</button>
  </div>
</header>
<main id="app" tabindex="-1"></main>
<footer id="foot" class="foot" hidden>
  <div class="foot-in">
    <div><strong>🍲 Aget</strong><p class="muted">Fresh food, delivered fast.</p></div>
    <div><strong>Help</strong><p class="muted">help@Aget.example<br>+1 555 0100</p></div>
    <p class="muted">© 2026 Aget Food Delivery</p>
  </div>
</footer>
<div id="toasts" role="status" aria-live="polite"></div>
<div id="modal" class="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <header><h2 id="mTitle"></h2><button class="iconbtn" data-act="closeModal" aria-label="Close">✕</button></header>
    <div id="mBody"></div>
    <div id="mActions" class="mact"></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
